[package]
name = "pdfrs"
version = "0.1.12"
edition = "2024"
description = "Pure Rust PDF toolkit: Markdown to PDF, merge/split/validate, search/redact, rasterize, full SVG, Unicode/CJK, charts, thesis layout, CLI (pdfcli) and WASM — no Poppler, PDFium, or LaTeX"
authors = ["Ying Kit WONG"]
documentation = "https://docs.rs/pdfrs"
repository = "https://github.com/yingkitw/pdfrs"
homepage = "https://github.com/yingkitw/pdfrs"
readme = "README.md"
license = "Apache-2.0"
keywords = ["pdf", "markdown", "wasm", "cli", "unicode"]
categories = [
    "command-line-utilities",
    "encoding",
    "parsing",
    "text-processing",
    "graphics",
]

[lib]
name = "pdfrs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
syntect = { version = "5.0", default-features = false, features = ["default-fancy"] }
rayon = { version = "1.10", optional = true }
ttf-parser = "0.25"
wasm-bindgen = { version = "0.2", optional = true }
subsetter = "0.2"
flate2 = "1.0"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
tokio = { version = "1.0", features = ["fs", "rt", "macros"], optional = true }
# CLI-only (binary target)
clap = { version = "4.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# API-only
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6", features = ["cors", "limit"], optional = true }
base64 = { version = "0.22", optional = true }

# Secure randomness for encryption (salts, IVs, file keys).
# wasm32-unknown-unknown has no backend without extra wiring; encryption
# returns an error there instead of falling back to weak randomness.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.3"

[features]
default = ["parallel", "cli"]
async = ["tokio"]
parallel = ["rayon"]
wasm = ["wasm-bindgen"]
cli = ["dep:clap", "dep:serde_json"]
api = ["dep:axum", "dep:tower-http", "dep:base64", "dep:serde_json", "tokio/net"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio = { version = "1.0", features = ["rt", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pdfcli"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "pdf_benchmarks"
harness = false
