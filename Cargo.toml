[package]
name = "pdfrs"
version = "0.1.4"
edition = "2024"
description = "A CLI tool to read/write PDFs and convert to/from markdown"
authors = ["Ying Kit WONG"]
documentation = "https://docs.rs/pdfrs"
repository = "https://github.com/yingkitw/pdfrs"
homepage = "https://github.com/yingkitw/pdfrs"
license = "Apache-2.0"
keywords = ["pdf", "markdown", "cli"]

[lib]
name = "pdfrs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.0"
rayon = { version = "1.10", optional = true }
ttf-parser = "0.25"
wasm-bindgen = { version = "0.2", optional = true }
subsetter = "0.2"
flate2 = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["fs", "rt", "macros"], optional = true }

[features]
default = ["parallel"]
async = ["tokio"]
parallel = ["rayon"]
wasm = ["wasm-bindgen"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio = { version = "1.0", features = ["rt", "macros", "rt-multi-thread"] }

[[bin]]
name = "pdfcli"
path = "src/main.rs"

[[bench]]
name = "pdf_benchmarks"
harness = false
